[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levipack-forge"
version = "0.5.0"
description = "Convert Fabric (Java) mods into LeviLauncher Android .levipack native-mod projects"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
levipack-forge = "levipack_forge.cli:main"

[tool.setuptools.packages.find]
include = ["levipack_forge*"]

[tool.setuptools.package-data]
levipack_forge = ["data/*.json", "template/**/*", "template/.clang-format", "template/.gitattributes"]
